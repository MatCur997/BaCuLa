<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prenotazioni vocali</title>
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --ink: #2b2420; --muted: #7a6f66; --line: #e8e0d6;
    --accent: #9c3d2e; --accent-ink: #ffffff; --rec: #c62828; --user: #f1ebe3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --card: #262220; --ink: #f2ece6; --muted: #a89f97; --line: #3a3430;
      --accent: #e0846f; --accent-ink: #1c1917; --rec: #ef5350; --user: #322c29;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: auto; padding: 24px 16px 40px; display: flex; flex-direction: column; gap: 20px; }
  h1 { margin: 0; font-size: 24px; text-align: center; }
  .subtitle { margin: 4px 0 0; text-align: center; color: var(--muted); }
  .talk { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #mic {
    width: 132px; height: 132px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font: 600 15px system-ui, sans-serif;
    box-shadow: 0 6px 18px rgb(0 0 0 / .15); transition: transform .1s, background .2s;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #mic:disabled { opacity: .5; cursor: default; }
  #mic.recording { background: var(--rec); transform: scale(1.08); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 14px rgb(198 40 40 / .15); } }
  #status { min-height: 1.5em; color: var(--muted); text-align: center; }
  .hint { font-size: 13px; color: var(--muted); }
  #log { display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 10px 14px; border-radius: 14px; max-width: 85%; }
  .msg.bot { background: var(--card); border: 1px solid var(--line); align-self: flex-start; }
  .msg.user { background: var(--user); align-self: flex-end; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  summary { cursor: pointer; font-weight: 600; }
  #sent { font: 13px ui-monospace, Consolas, monospace; white-space: pre-wrap; color: var(--muted); }
  .row { display: flex; justify-content: center; gap: 8px; }
  .secondary { background: transparent; border: 1px solid var(--line); color: var(--ink); padding: 6px 12px; border-radius: 8px; cursor: pointer; font: inherit; }
</style>
</head>
<body>
<main>
  <div>
    <h1 id="title">Prenota a voce</h1>
    <p class="subtitle">Tieni premuto il pulsante e parla, poi rilascialo.</p>
  </div>

  <div class="talk">
    <button id="mic" disabled>Avvio…</button>
    <div id="status">Premi il pulsante per iniziare.</div>
    <div class="hint">Puoi anche tenere premuta la barra spaziatrice.</div>
  </div>

  <div id="log" aria-live="polite"></div>

  <details>
    <summary>Privacy: cosa riceve il server</summary>
    <p class="hint">I dati personali vengono sostituiti da segnaposto su questo dispositivo, prima dell'invio.</p>
    <div id="sent">Nessun messaggio inviato.</div>
  </details>

  <div class="row"><button class="secondary" id="reset">Nuova conversazione</button></div>
</main>
<audio id="player"></audio>
<script>
const $ = (id) => document.getElementById(id);
const mic = $("mic"), statusEl = $("status"), player = $("player");
let sessionId = crypto.randomUUID().replaceAll("-", "");
let started = false, recorder = null, chunks = [], busy = false, sentLines = [];

function setStatus(text) { statusEl.textContent = text; }
function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.textContent = text;
  $("log").appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
}
function play(b64) {
  if (!b64) return Promise.resolve();
  player.src = `data:audio/wav;base64,${b64}`;
  return new Promise((resolve) => {
    player.onended = resolve; player.onerror = resolve;
    player.play().catch(resolve);
  });
}

async function start() {
  // Il primo clic sblocca l'audio nel browser e fa partire il saluto.
  started = true;
  mic.disabled = true;
  setStatus("Preparo l'assistente…");
  try {
    const res = await fetch("/api/greeting");
    const data = await res.json();
    addMessage("bot", data.risposta);
    setStatus("L'assistente sta parlando…");
    mic.disabled = false;
    mic.textContent = "Tieni premuto per parlare";
    await play(data.audio);
  } catch (e) {
    setStatus("Il voice-bot non risponde. Controlla che il server sia avviato.");
    started = false;
  }
  mic.disabled = false;
  if (started) setStatus("Pronto: tieni premuto e parla.");
}

async function startRecording() {
  if (busy || recorder) return;
  player.pause();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    recorder.onstop = () => { stream.getTracks().forEach((t) => t.stop()); sendTurn(); };
    recorder.start();
    mic.classList.add("recording");
    setStatus("Ti ascolto…");
  } catch (e) {
    setStatus("Microfono non disponibile: consenti l'accesso e apri la pagina da http://localhost.");
    recorder = null;
  }
}

function stopRecording() {
  if (!recorder) return;
  mic.classList.remove("recording");
  recorder.stop();
  recorder = null;
}

async function sendTurn() {
  const blob = new Blob(chunks, { type: chunks[0]?.type || "audio/webm" });
  if (blob.size < 2000) { setStatus("Troppo breve: tieni premuto mentre parli."); return; }
  busy = true;
  mic.disabled = true;
  setStatus("Sto pensando…");
  const form = new FormData();
  form.append("session_id", sessionId);
  form.append("audio", blob, "turno.webm");
  try {
    const res = await fetch("/api/turn", { method: "POST", body: form });
    if (!res.ok) throw new Error(res.statusText);
    const data = await res.json();
    if (data.trascrizione) addMessage("user", data.trascrizione);
    if (data.inviato_al_server) {
      sentLines.push(data.inviato_al_server);
      $("sent").textContent = sentLines.join("\n");
    }
    addMessage("bot", data.risposta);
    mic.disabled = false;
    busy = false;
    setStatus("L'assistente sta parlando… (premi per interromperlo)");
    await play(data.audio);
    if (!busy && !recorder) setStatus("Pronto: tieni premuto e parla.");
  } catch (e) {
    setStatus("Errore di comunicazione con il voice-bot. Riprova.");
  } finally {
    busy = false;
    mic.disabled = false;
  }
}

mic.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (!started) { start(); return; }
  startRecording();
});
mic.addEventListener("pointerup", stopRecording);
mic.addEventListener("pointerleave", stopRecording);
document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && !e.repeat && started && e.target.tagName !== "BUTTON") { e.preventDefault(); startRecording(); }
});
document.addEventListener("keyup", (e) => { if (e.code === "Space" && started) { e.preventDefault(); stopRecording(); } });

$("reset").addEventListener("click", async () => {
  player.pause();
  const form = new FormData();
  form.append("session_id", sessionId);
  await fetch("/api/reset", { method: "POST", body: form }).catch(() => {});
  sessionId = crypto.randomUUID().replaceAll("-", "");
  $("log").innerHTML = "";
  sentLines = [];
  $("sent").textContent = "Nessun messaggio inviato.";
  started = false;
  mic.textContent = "Inizia";
  setStatus("Premi il pulsante per iniziare.");
});

mic.disabled = false;
mic.textContent = "Inizia";
</script>
</body>
</html>
