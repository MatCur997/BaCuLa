<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prenotazioni del giorno</title>
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --ink: #2b2420; --muted: #7a6f66; --line: #e8e0d6;
    --accent: #9c3d2e; --free: #e9f3ea; --free-ink: #2f6b3a; --busy: #fbeee9; --busy-ink: #9c3d2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --card: #262220; --ink: #f2ece6; --muted: #a89f97; --line: #3a3430;
      --accent: #e0846f; --free: #1f2f22; --free-ink: #8fd19b; --busy: #3a2420; --busy-ink: #f0a594;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1100px; margin: auto; display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
  h1 { margin: 0; font-size: 22px; }
  h1 small { display: block; font-size: 14px; color: var(--muted); font-weight: 400; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  input, button { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  button { cursor: pointer; }
  main { max-width: 1100px; margin: auto; padding: 8px 16px 32px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 8px 0 20px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .stat b { display: block; font-size: 24px; }
  .stat span { color: var(--muted); font-size: 13px; }
  h2 { font-size: 17px; margin: 24px 0 10px; text-transform: capitalize; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .table { border-radius: 10px; padding: 10px 12px; border: 1px solid var(--line); }
  .table.free { background: var(--free); color: var(--free-ink); }
  .table.busy { background: var(--busy); color: var(--busy-ink); }
  .table .head { display: flex; justify-content: space-between; font-weight: 600; }
  .table .meta { font-size: 12px; opacity: .8; }
  .table .booking { margin-top: 6px; color: var(--ink); font-size: 14px; }
  .notice { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .error { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1 id="title">Prenotazioni<small id="subtitle">Vista del ristoratore</small></h1>
  <div class="controls">
    <input type="date" id="day" aria-label="Giorno">
    <input type="password" id="key" placeholder="Chiave di accesso" aria-label="Chiave di accesso">
    <button id="load">Aggiorna</button>
  </div>
</header>
<main id="content"><p class="notice">Inserisci la chiave di accesso e premi Aggiorna.</p></main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = new Date(); today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
$("day").value = today.toISOString().slice(0, 10);
try { $("key").value = sessionStorage.getItem("bacula-key") || ""; } catch (e) {}

async function load() {
  const key = $("key").value.trim();
  if (!key) return;
  try { sessionStorage.setItem("bacula-key", key); } catch (e) {}
  let data;
  try {
    const res = await fetch(`/api/admin/overview?date=${$("day").value}`, { headers: { "X-API-Key": key } });
    if (res.status === 401) throw new Error("Chiave di accesso non valida.");
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    data = await res.json();
  } catch (err) {
    $("content").innerHTML = `<p class="notice error">${esc(err.message)}</p>`;
    return;
  }
  render(data);
}

function render(d) {
  $("subtitle").textContent = `${d.giorno} ${d.data.split("-").reverse().join("/")}`;
  if (d.chiuso) {
    $("content").innerHTML = `<p class="notice">Il ristorante è chiuso in questa data.</p>`;
    return;
  }
  const shifts = Object.entries(d.turni);
  const tot = (k) => shifts.reduce((s, [, t]) => s + t[k], 0);
  let html = `<div class="stats">
    <div class="stat"><b>${tot("prenotazioni")}</b><span>prenotazioni</span></div>
    <div class="stat"><b>${tot("coperti")}</b><span>coperti</span></div>
    ${shifts.map(([n, t]) => `<div class="stat"><b>${t.occupazione_percentuale}%</b><span>posti occupati a ${n}</span></div>`).join("")}
    <div class="stat"><b>${d.cancellate}</b><span>cancellate</span></div>
  </div>`;
  for (const [name, t] of shifts) {
    html += `<h2>${esc(name)} · ${t.tavoli_occupati}/${t.tavoli_totali} tavoli · ${t.coperti} coperti</h2><div class="grid">`;
    for (const tb of t.tavoli) {
      const b = tb.prenotazione;
      html += `<div class="table ${b ? "busy" : "free"}">
        <div class="head"><span>${esc(tb.nome)}</span><span>${b ? esc(b.orario) : "libero"}</span></div>
        <div class="meta">${tb.posti} posti · ${esc(tb.zona)}</div>
        ${b ? `<div class="booking">${b.persone} persone · cod. ${esc(b.codice)}${b.note ? `<br><em>${esc(b.note)}</em>` : ""}</div>` : ""}
      </div>`;
    }
    html += `</div>`;
  }
  $("content").innerHTML = html;
}

$("load").addEventListener("click", load);
$("day").addEventListener("change", load);
$("key").addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });
setInterval(load, 30000);
load();
</script>
</body>
</html>
