[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bacula-shared"
version = "1.0.0"
description = "Filtro dati personali e client API condivisi da chat-bot e voice-bot"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# Migliora il riconoscimento dei nomi; poi: python -m spacy download it_core_news_sm
ner = ["spacy>=3.7"]

[tool.setuptools]
packages = ["bacula_shared"]
